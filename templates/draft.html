<!doctype html><html lang='zh-Hant'><head><meta charset='utf-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>選秀大廳 - 加入房間</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#0f172a;color:#e2e8f0}nav{background:#1e293b;padding:12px 20px;display:flex;gap:12px;flex-wrap:wrap;border-bottom:1px solid #334155}nav a{color:#cbd5e1;text-decoration:none;font-weight:600;padding:6px 12px;border-radius:6px;background:#0f172a;border:1px solid #334155}nav a.active{color:#38bdf8;border-color:#38bdf8}.container{max-width:1280px;margin:20px auto;padding:0 16px;display:grid;gap:16px}.card{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:16px}.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}input,select,button{background:#0f172a;color:#f8fafc;border:1px solid #475569;border-radius:6px;padding:8px 11px;font-size:14px}button{background:#0284c7;border-color:#0284c7;font-weight:600;cursor:pointer}button.secondary{background:#334155;border-color:#475569}.timer{font-size:28px;font-weight:800;color:#38bdf8}.pool-list{max-height:360px;overflow-y:auto;border:1px solid #334155;border-radius:8px}.pool-item{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid #263349;font-size:13px;gap:8px}.muted{color:#94a3b8;font-size:13px}.msg{color:#fbbf24;font-size:13px;min-height:18px}.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;background:#0f172a;border:1px solid #475569;color:#38bdf8}</style></head><body><nav><a href='/'>首頁</a><a href='/roster'>名單</a><a href='/standings'>戰績</a><a href='/matchup'>調度</a><a href='/draft' class='active'>選秀</a></nav><div class='container'><div class='card'><div class='row' style='justify-content:space-between'><div><strong>加入選秀房間</strong> <span class='muted'>—— 選擇房間與隊伍，輸入密碼即可加入</span></div><span id='verifiedTeamLabel' class='badge'>尚未加入</span></div><div class='row' style='margin-bottom:0'><select id='roomSelect' onchange='onRoomChanged()' style='min-width:240px'></select><select id='teamSelect' style='min-width:160px'></select><input id='joinPassword' type='password' placeholder='房間密碼（可留空）' style='width:180px'/><button type='button' onclick='joinRoom()'>加入房間</button><button type='button' class='secondary' onclick='loadRooms()'>重新整理</button></div><div id='authMsg' class='msg' style='margin-top:8px'></div></div><div class='card'><div class='row' style='justify-content:space-between'><div><strong id='roomHeading'>尚未選擇房間</strong> <span id='roomMeta' class='muted'></span></div><div class='timer' id='countdown'>--s</div></div><div id='liveBanner' class='row' style='margin-bottom:6px'></div><div id='draftMsg' class='msg'></div></div><div class='grid-3'><div class='card'><strong>可選球員池</strong><div class='row' style='margin-top:8px'><input id='poolSearch' placeholder='搜尋球員或守備' oninput='renderPool()' style='flex:1'/><select id='posFilter' onchange='renderPool()'><option value=''>全部守備</option><option value='P'>投手</option><option value='C'>捕手</option><option value='1B'>一壘</option><option value='2B'>二壘</option><option value='3B'>三壘</option><option value='SS'>游擊</option><option value='OF'>外野</option><option value='DH'>指定打擊</option></select></div><div id='poolList' class='pool-list'></div></div><div class='card'><strong>競標 / 指名操作</strong><div id='actionPanel' class='muted' style='margin-top:8px'>請先加入房間。</div></div><div class='card'><strong>各隊預算與已選名單</strong><div id='teamsPanel' style='margin-top:8px'></div></div></div></div><script>
let roomsCache=[], currentRoomId=null, currentState=null, verifiedTeam=null, selectedPlayerId=null, pollTimer=null;
const tKey=id=>`draft_token_${id}`, getTok=id=>localStorage.getItem(tKey(id))||'', setTok=(id,v)=>v?localStorage.setItem(tKey(id),v):localStorage.removeItem(tKey(id));
function updateAuthUI(){const l=document.getElementById('verifiedTeamLabel');l.textContent=verifiedTeam?`已加入：${verifiedTeam}`:'尚未加入';l.style.color=verifiedTeam?'#34d399':'#38bdf8';}
async function loadRooms(){const d=await(await fetch('/api/draft/rooms')).json();if(!d.ok)return;roomsCache=d.rooms||[];const s=document.getElementById('roomSelect'),p=currentRoomId||s.value;s.innerHTML=roomsCache.map(r=>`<option value="${r.id}">#${r.id} ${r.title} (${r.mode}/${r.status})</option>`).join('');if(roomsCache.length){if(p&&roomsCache.some(r=>String(r.id)===String(p)))s.value=p;await onRoomChanged();}else document.getElementById('roomHeading').textContent='目前尚無選秀房';}
async function onRoomChanged(){currentRoomId=Number(document.getElementById('roomSelect').value);const rm=roomsCache.find(r=>Number(r.id)===currentRoomId);document.getElementById('teamSelect').innerHTML=((rm&&rm.team_order)||[]).map(t=>`<option value="${t}">${t}</option>`).join('');verifiedTeam=null;await fetchState(Boolean(getTok(currentRoomId)));startPolling();}
async function joinRoom(){if(!currentRoomId)return;const team=document.getElementById('teamSelect').value,pw=document.getElementById('joinPassword').value,m=document.getElementById('authMsg');const d=await(await fetch(`/api/draft/rooms/${currentRoomId}/auth`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fantasy_team:team,password:pw})})).json();if(d.ok){setTok(currentRoomId,d.token);verifiedTeam=d.fantasy_team;m.style.color='#34d399';m.textContent=`已成功以「${d.fantasy_team}」加入選秀房`;updateAuthUI();await fetchState();}else{m.style.color='#f87171';m.textContent=d.error||'加入失敗';}}
async function fetchState(silent=false){if(!currentRoomId)return;const tok=getTok(currentRoomId),d=await(await fetch(`/api/draft/rooms/${currentRoomId}/state`,{headers:tok?{'X-Draft-Token':tok}:{}})).json();if(!d.ok)return;currentState=d;if(d.authenticated_team){verifiedTeam=d.authenticated_team;if(!silent&&!document.getElementById('authMsg').textContent){const m=document.getElementById('authMsg');m.style.color='#34d399';m.textContent=`目前身分：${verifiedTeam}`;}}else if(!silent)verifiedTeam=null;updateAuthUI();renderAll();}
function renderAll(){if(!currentState)return;const r=currentState.room;document.getElementById('roomHeading').textContent=`#${r.id} ${r.title}`;document.getElementById('roomMeta').textContent=` — 模式：${r.mode}｜狀態：${r.status}｜上限：${r.picks_per_team}人｜入隊：${r.target_slot}`;const b=document.getElementById('liveBanner');if(r.mode==='AUCTION'){const lot=currentState.active_lot;b.innerHTML=lot?`<span class="badge">競標中：${lot.player_name} (${lot.pos})</span><span class="badge">最高價：$${lot.current_bid}（${lot.current_winner||'尚無人出價'}）</span>`:'<span class="muted">目前沒有進行中的競標球員，請由輪值隊伍提名。</span>';}else b.innerHTML=`<span class="badge">目前輪到指名：${currentState.current_turn_team||'-'}</span><span class="badge">第 ${currentState.pick_count+1} 順位</span>`;renderPool();renderActionPanel();renderTeamsPanel();updateCountdown();}
function renderPool(){const kw=(document.getElementById('poolSearch').value||'').trim().toLowerCase(),pos=document.getElementById('posFilter').value,list=((currentState&&currentState.pool)||[]).filter(x=>(!pos||(x.pos||'').includes(pos))&&(!kw||`${x.name} ${x.pos} ${x.team||''}`.toLowerCase().includes(kw)));document.getElementById('poolList').innerHTML=list.slice(0,120).map(x=>`<div class="pool-item"><div><strong>${x.name}</strong> <span class="muted">${x.pos} / ${x.team||'-'}</span></div><button type="button" class="secondary" onclick="selectPlayer(${x.player_id})">選擇</button></div>`).join('')||'<div class="pool-item muted">無符合條件球員</div>';}
function selectPlayer(id){selectedPlayerId=id;renderActionPanel();}
function renderActionPanel(){const el=document.getElementById('actionPanel');if(!currentState)return;if(!verifiedTeam){el.innerHTML='<div class="muted">請先在上方選擇隊伍與密碼加入房間。</div>';return;}const sp=(currentState.pool||[]).find(x=>Number(x.player_id)===Number(selectedPlayerId)),st=sp?`已選球員：<strong>${sp.name}</strong> (${sp.pos})`:'尚未從左側選擇球員';if(currentState.room.mode==='AUCTION'){const lot=currentState.active_lot;if(!lot)el.innerHTML=`<div class="row">${st}</div><div class="row"><label class="muted">起標價 <input id="startBidInput" type="number" value="1" min="1" style="width:80px"/></label><button type="button" onclick="nominatePlayer()">提名此球員競標</button></div>`;else{const nm=Number(lot.current_bid||1)+1;el.innerHTML=`<div class="row">競標標的：<strong>${lot.player_name}</strong> (${lot.pos})｜目前最高：$${lot.current_bid} (${lot.current_winner||'-'})</div><div class="row"><label class="muted">出價 <input id="bidAmountInput" type="number" value="${nm}" min="${nm}" style="width:90px"/></label><button type="button" onclick="placeBid()">送出出價</button></div>`;}}else el.innerHTML=`<div class="row">${st}</div><div class="row"><button type="button" onclick="makePick()">確認指名此球員</button></div>`;}
async function nominatePlayer(){if(!selectedPlayerId)return setMsg('請先選擇一位球員');const sb=Number(document.getElementById('startBidInput')?.value||1),d=await(await fetch(`/api/draft/rooms/${currentRoomId}/nominate`,{method:'POST',headers:{'Content-Type':'application/json','X-Draft-Token':getTok(currentRoomId)},body:JSON.stringify({player_id:selectedPlayerId,start_bid:sb})})).json();setMsg(d.ok?'已發起競標':(d.error||'提名失敗'));await fetchState(true);}
async function placeBid(){const amt=Number(document.getElementById('bidAmountInput')?.value||0),d=await(await fetch(`/api/draft/rooms/${currentRoomId}/bid`,{method:'POST',headers:{'Content-Type':'application/json','X-Draft-Token':getTok(currentRoomId)},body:JSON.stringify({amount:amt})})).json();setMsg(d.ok?`已出價 $${amt}`:(d.error||'出價失敗'));await fetchState(true);}
async function makePick(){if(!selectedPlayerId)return setMsg('請先選擇一位球員');const d=await(await fetch(`/api/draft/rooms/${currentRoomId}/pick`,{method:'POST',headers:{'Content-Type':'application/json','X-Draft-Token':getTok(currentRoomId)},body:JSON.stringify({player_id:selectedPlayerId})})).json();setMsg(d.ok?'指名成功':(d.error||'指名失敗'));await fetchState(true);}
function renderTeamsPanel(){const ts=(currentState&&currentState.teams)||[];document.getElementById('teamsPanel').innerHTML=ts.map(t=>`<div style="border-bottom:1px solid #334155;padding:8px 0"><div><strong>${t.fantasy_team}</strong> <span class="muted">剩餘預算：$${t.budget_remaining}｜已選 ${(t.picks||[]).length} 人</span></div><div class="muted">${(t.picks||[]).map(x=>`${x.player_name}($${x.price})`).join('、')||'尚無球員'}</div></div>`).join('')||'<div class="muted">尚無隊伍資料</div>';}
function updateCountdown(){const el=document.getElementById('countdown');if(!currentState||(currentState.seconds_remaining===undefined&&currentState.seconds_remaining!==0)){el.textContent='--s';return;}el.textContent=`${Math.max(0,Math.floor(currentState.seconds_remaining))}s`;}
function setMsg(m){document.getElementById('draftMsg').textContent=m||'';}
function startPolling(){if(pollTimer)clearInterval(pollTimer);pollTimer=setInterval(()=>{if(currentState&&currentState.seconds_remaining>0){currentState.seconds_remaining-=1;updateCountdown();}fetchState(true);},1000);}
loadRooms();
</script></body></html>
